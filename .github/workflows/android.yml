name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore project signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          value = os.environ['ANDROID_KEYSTORE_BASE64']
          assert value, 'Missing ANDROID_KEYSTORE_BASE64'
          key = Path(os.environ['RUNNER_TEMP']) / 'linkisland-signing.p12'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'LINKISLAND_KEYSTORE_FILE={key}\n')
          PY

      - name: Test and build Debug and Release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify APK signatures
        run: |
          for variant in debug release; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "app/build/outputs/apk/$variant/app-$variant.apk"
          done
      - name: Name APKs and create checksums
        id: package
        run: python3 .github/scripts/package_apks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LinkIsland-${{ steps.package.outputs.version }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload both APKs to Message
        env:
          MESSAGE_PUSH_URL: ${{ secrets.MESSAGE_PUSH_URL }}
          MESSAGE_PUSH_API_TOKEN: ${{ secrets.MESSAGE_PUSH_API_TOKEN }}
          MESSAGE_PUSH_CHANNEL_ID: ${{ secrets.MESSAGE_PUSH_CHANNEL_ID }}
        run: bash .github/scripts/upload_message.sh
      - name: Remove runner signing key
        if: always()
        run: |
          if [[ -n "${LINKISLAND_KEYSTORE_FILE:-}" ]]; then rm -f "$LINKISLAND_KEYSTORE_FILE"; fi
